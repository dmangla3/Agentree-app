    <rect x="28" y="266" width="4" height="90" rx="2" fill="#FF4A9B"/>
    <text x="46" y="294" fill="#FF8FC0" font-size="12" font-weight="600" letter-spacing="1">APPROACH A</text>
    <text x="46" y="327" fill="#F0F3F8" font-size="21" font-weight="500">Signed tokens</text>
    <rect x="252" y="266" width="200" height="90" rx="10" fill="#211C12" stroke="#79612E"/>
    <rect x="252" y="266" width="4" height="90" rx="2" fill="#FFBC39"/>
