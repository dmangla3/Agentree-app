<svg xmlns="http://www.w3.org/2000/svg" width="480" height="520" viewBox="0 0 480 520" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">One conversation. Every path.</title>
  <desc id="desc">A conceptual workflow: branch an authentication question into signed tokens and server sessions. Keep each approach in its own worktree, with its own Git commit.</desc>
  <rect x="1" y="1" width="478" height="518" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
