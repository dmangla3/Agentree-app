    <text x="47" y="37" fill="#9BA6B4" font-size="13" font-weight="600" letter-spacing="1.3">CONCEPTUAL WORKFLOW</text>
    <text x="28" y="79" fill="#F0F3F8" font-size="27" font-weight="600">One conversation. Every path.</text>
    <path d="M1 103H479" stroke="#30363D"/>
    <rect x="28" y="128" width="424" height="72" rx="10" fill="#161B22" stroke="#444D59"/>
    <text x="46" y="153" fill="#A7B1BE" font-size="12" font-weight="600" letter-spacing="1.1">YOU</text>
    <text x="46" y="181" fill="#F0F3F8" font-size="22" font-weight="500">How should auth work?</text>
    <path d="M240 200V216C240 228 234 234 222 234H146C134 234 128 240 128 252V266" stroke="#FF4A9B" stroke-width="3"/>
    <path d="M240 200V216C240 228 246 234 258 234H334C346 234 352 240 352 252V266" stroke="#FFBC39" stroke-width="3"/>
