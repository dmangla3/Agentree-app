[package]
name = "agentree"
version = "0.1.17"
description = "Agentree - AI-powered development workspace"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agentree_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["test", "specta"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-pilot = "0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["serde_json"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
rusqlite = { version = "0.31.0", features = ["bundled", "backup"] }
reqwest = { version = "0.11", features = ["blocking", "json"] }
axum = "0.7"
walkdir = "2"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
libc = "0.2"
async-trait = "0.1"
ignore = "0.4"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
tempfile = "3"
base64 = "0.22"

[dev-dependencies]

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
