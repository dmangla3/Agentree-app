    <path d="M122 377L128 383L134 377" stroke="#FF4A9B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M346 377L352 383L358 377" stroke="#FFBC39" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="28" y="392" width="200" height="70" rx="10" fill="#161B22" stroke="#444D59"/>
    <text x="46" y="417" fill="#A7B1BE" font-size="13">Git commit</text>
    <text x="46" y="443" fill="#F0F3F8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21">a1b2c3d</text>
    <rect x="252" y="392" width="200" height="70" rx="10" fill="#161B22" stroke="#444D59"/>
    <text x="270" y="417" fill="#A7B1BE" font-size="13">Git commit</text>
